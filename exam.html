<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기출 모의고사</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .qnum {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 24px;
            border-radius: 50%;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }
        .qopts-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .q-opt-label {
            display: block;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .q-opt-label:hover {
            background: white;
            border-color: var(--primary-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .q-opt-label input[type="radio"] {
            margin-right: 0.5rem;
            accent-color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div id="loader" class="loader-wrapper hidden">
        <div class="loader"></div>
        <div style="font-weight: 600; color: var(--primary-dark);">로딩 중...</div>
    </div>

    <div class="app-wrapper">
        <header class="header">
            <div class="header-title">
                 <a href="index.html" style="color: inherit;"><i class="fas fa-arrow-left"></i> 뒤로</a>
            </div>
            <div class="user-info">
                기출 모의고사
            </div>
        </header>

        <!-- Setup Screen -->
        <div id="exam-setup" class="glass-container">
            <h2 class="text-center mb-4">어떤 모의고사를 볼까요?</h2>
            
            <div class="dashboard-grid">
                <div class="glass-card" style="text-align: center;">
                    <h3><i class="fas fa-book-open"></i> 과목별 모의고사 (25문항)</h3>
                    <p class="mb-4">원하는 과목을 선택하여 집중적으로 연습합니다.</p>
                    <select id="subject-select" class="form-control mb-4">
                        <option value="">-- 과목을 선택하세요 --</option>
                    </select>
                    <button class="btn btn-primary" onclick="generateExam('subject')">시작하기</button>
                </div>
                
                <div class="glass-card" style="text-align: center;">
                    <h3><i class="fas fa-random"></i> 전과목 모의고사 (80문항)</h3>
                    <p class="mb-4">모든 영역에서 무작위로 80문제가 출제됩니다.</p>
                    <br/>
                    <button class="btn btn-outline" onclick="generateExam('random80')">시작하기</button>
                </div>
            </div>
        </div>

        <!-- Testing Screen -->
        <div id="exam-test" class="hidden">
            <div id="question-container">
                <!-- Javascript will render questions here -->
            </div>
            
            <div class="glass-container mt-4" style="text-align: center;">
                <button class="btn btn-primary btn-block" onclick="submitExam()">제출 및 채점하기</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="exam-result" class="hidden glass-container mt-4" style="text-align: center;">
            <h2 class="text-primary"><i class="fas fa-trophy"></i> 채점 결과</h2>
            <h3 id="score-text" class="mb-4 text-primary"></h3>
            <p>틀린 문제는 오답노트에 자동으로 저장되었습니다.</p>
            <div class="mt-4" style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn btn-outline" onclick="resetExam()">다시 풀기</button>
                <a href="note.html" class="btn btn-primary">오답노트 확인</a>
            </div>
        </div>
    </div>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/exam.js"></script>
</body>
</html>

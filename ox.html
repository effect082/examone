<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OX 퀴즈 - 프리미엄 학습 프로그램</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="loader" class="loader-wrapper hidden">
        <div class="loader"></div>
        <div style="font-weight: 600; color: var(--primary-dark);">데이터를 준비하고 있습니다...</div>
    </div>

    <div class="app-wrapper">
        <header class="header">
            <div class="header-title">
                 <a href="index.html" class="text-primary"><i class="fas fa-arrow-left"></i> 뒤로가기</a>
            </div>
            <div class="user-info" style="color: var(--primary-dark); font-size: 1.2rem;">
                OX 퀴즈 챌린지
            </div>
        </header>

        <!-- Setup Screen -->
        <div id="ox-setup" class="glass-container">
            <div class="text-center mb-4">
                <h1 style="color: var(--primary-dark); font-size: 2rem;">학습 모드 선택</h1>
                <p>매일 20문제 이상 꾸준히 학습하여 합격에 한 걸음 더 다가가세요.</p>
            </div>
            
            <div class="dashboard-grid">
                <div class="glass-card" style="text-align: center; border-radius: 20px;">
                    <div class="dash-icon"><i class="fas fa-book-open"></i></div>
                    <h3>과목별 집중 모드</h3>
                    <p class="mb-4">취약한 8과목 중 하나를 선택해 깊이 있게 학습합니다.</p>
                        <select id="subject-select" class="form-control mb-4" style="border-radius: 12px; height: 50px;">
                            <option value="">-- 과목 선택 --</option>
                            <optgroup label="1교시: 사회복지기초">
                                <option value="인간행동과 사회환경">인간행동과 사회환경</option>
                                <option value="사회복지조사론">사회복지조사론</option>
                            </optgroup>
                            <optgroup label="2교시: 사회복지실천">
                                <option value="사회복지실천론">사회복지실천론</option>
                                <option value="사회복지실천기술론">사회복지실천기술론</option>
                                <option value="지역사회복지론">지역사회복지론</option>
                            </optgroup>
                            <optgroup label="3교시: 사회복지정책과 제도">
                                <option value="사회복지정책론">사회복지정책론</option>
                                <option value="사회복지행정론">사회복지행정론</option>
                                <option value="사회복지법제론">사회복지법제론</option>
                            </optgroup>
                        </select>
                    <button class="btn btn-primary btn-block" onclick="generateQuiz('subject')">과목별 퀴즈 시작</button>
                </div>
                
                <div class="glass-card" style="text-align: center; border-radius: 20px;">
                    <div class="dash-icon"><i class="fas fa-random"></i></div>
                    <h3>실전 랜덤 모드</h3>
                    <p class="mb-4">전체 범위에서 무작위로 20~30문항을 추출해 실력을 점검합니다.</p>
                    <br/>
                    <button class="btn btn-outline btn-block" onclick="generateQuiz('random')">랜덤 퀴즈 시작</button>
                </div>
            </div>
        </div>

        <!-- Testing Screen -->
        <div id="ox-test" class="hidden">
            <div class="ox-container">
                <div id="question-container">
                    <!-- Javascript will render ox-card here -->
                </div>
                
                <div id="ox-controls" class="hidden mt-4" style="text-align: center; display: flex; flex-direction: column; gap: 1rem; align-items: center;">
                    <button id="next-q-btn" class="btn btn-primary" style="width: 200px; height: 56px; font-size: 1.1rem; border-radius: 28px;" onclick="nextQuestion()">다음 문제 <i class="fas fa-arrow-right"></i></button>
                    <button id="add-note-btn" class="btn btn-outline" style="border: none; color: var(--primary-color); font-size: 0.9rem;" onclick="addCurrentToNotes()"><i class="fas fa-plus-circle"></i> 이 지문 오답노트에 추가하기</button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="ox-result" class="hidden glass-container mt-4" style="text-align: center; max-width: 600px; margin: 0 auto; color: var(--text-primary);">
            <div style="font-size: 4rem; color: var(--warning); margin-bottom: 1rem;"><i class="fas fa-trophy"></i></div>
            <h2 style="font-size: 2rem;">퀴즈 완료!</h2>
            <div id="score-text" style="font-size: 3rem; font-weight: 800; color: var(--primary-color); margin: 1rem 0;"></div>
            <p style="font-size: 1.1rem;">수고하셨습니다. 틀린 문제는 자동으로 오답노트에 반영되었습니다.</p>
            <div class="mt-4" style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn btn-outline" style="background: white;" onclick="resetQuiz()">한 번 더 도전</button>
                <a href="note.html" class="btn btn-primary">오답노트 확인</a>
            </div>
        </div>
    </div>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/ox.js"></script>
</body>
</html>
